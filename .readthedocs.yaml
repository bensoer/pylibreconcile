# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
  commands:
    - pip install uv
    - make install
    - make docs-strict

sphinx:
  configuration: docs/sphinx/source/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
