[project]
name = "pylibreconcile"
version = "0.1.0"
description = "Reconciliation utilities for processing data against reference sources."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Ben Soer", email = "ben@soernet.ca" },
]
keywords = ["reconciliation", "data", "matching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bsoer/pylibreconcile"
Documentation = "https://pylibreconcile.readthedocs.io/"
Repository = "https://github.com/bsoer/pylibreconcile"
Issues = "https://github.com/bsoer/pylibreconcile/issues"
Changelog = "https://github.com/bsoer/pylibreconcile/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylibreconcile"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "build>=1.5.0",
    "coverage>=7.15.4",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.2",
    "sphinx-click>=6.2.0",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=pylibreconcile",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-branch",
]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:botocore.*",
]

[tool.coverage.run]
branch = true
source = ["pylibreconcile"]
omit = [
    "tests/*",
    "docs/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
show_missing = true
precision = 2

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "TID",  # flake8-tidy-imports
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "S101",   # Use of assert detected (fine in tests)
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (common pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PT004"]
"docs/**/*.py" = ["S101", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["pylibreconcile"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/pylibreconcile"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true
plugins = []
exclude = [
    "tests/",
    "docs/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", "docs", "build", "dist"]
tests = ["B201", "B301"]
skips = ["B101"]
